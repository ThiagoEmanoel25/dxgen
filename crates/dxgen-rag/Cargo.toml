[package]
name = "dxgen-rag"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = { version = "0.12", optional = true }

[features]
# The cl100k_base vocabulary is large and nothing in the product calls
# --tokenize: only the parity and benchmark scripts do. Keeping it off by
# default leaves it out of every released binary.
tokenize = ["dep:tiktoken-rs"]
